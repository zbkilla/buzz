      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: rustfmt
        run: cargo fmt -p buzz-acp -- --check
      - name: clippy
        run: cargo clippy -p buzz-acp --all-targets --locked -- -D warnings
