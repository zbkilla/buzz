# Fork-only: build the zbk-droplet relay image and the agy-patched harness
# from pinned commits, as 3-day workflow artifacts the droplet downloads.
# No registry push, no secrets. Plan: /root/PLANS/BUZZ_RELAY_UPGRADE_2026_10_14.md
name: Fork image (zbk-droplet)

on:
  push:
    branches: ["upgrade/**-build"]

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact trees. MERGE_SHA = the fork main candidate; AGY_SHA = agy fix on target.
  MERGE_SHA: 6776e913b20cc8192e45ecf36b5ee9495b859380
  AGY_SHA: f4e0bb9d8db299803c601d390befd8cf32387b4c

jobs:
  relay-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # Same cap as upstream docker.yml: default parallelism OOMs the runner.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build runtime image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target runtime \
            --build-arg BUZZ_SOURCE_SHA="$MERGE_SHA" \
            --build-arg BUZZ_BUILD_ID="github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --build-arg BUZZ_BUILD_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --provenance=false --sbom=false \
            --label org.opencontainers.image.revision="$MERGE_SHA" \
            --tag "buzz-fork:${MERGE_SHA::8}" \
            --output "type=docker,dest=relay-image.tar" .
          gzip -6 relay-image.tar
          sha256sum relay-image.tar.gz | tee relay-image.tar.gz.sha256
          printf 'merge_sha=%s\nrun=%s\n' "$MERGE_SHA" "$GITHUB_RUN_ID" > relay-image.provenance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-image
          path: |
            relay-image.tar.gz
            relay-image.tar.gz.sha256
            relay-image.provenance
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  agy-sprig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.AGY_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$AGY_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cross@0.2.5
      - name: Build sprig (musl, same script as upstream sprig.yml)
        run: |
          set -euo pipefail
          USE_CROSS=1 ARCHIVE_BASENAME=sprig-agyfix-x86_64-unknown-linux-musl \
            ./scripts/build-sprig.sh "0.1.0+agyfix.${AGY_SHA::8}" x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agy-sprig
          path: dist/sprig-agyfix-x86_64-unknown-linux-musl.tar.gz*
          retention-days: 3
          if-no-files-found: error

  agy-acp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.AGY_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$AGY_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: buzz-acp package tests (nextest, process per test, as upstream)
        run: cargo nextest run -p buzz-acp --locked
