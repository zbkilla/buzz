      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cross@0.2.5
      - name: Build sprig (musl, same script as upstream sprig.yml)
        run: |
          set -euo pipefail
          USE_CROSS=1 ARCHIVE_BASENAME=sprig-fork-x86_64-unknown-linux-musl \
            ./scripts/build-sprig.sh "0.1.0+fork.${MERGE_SHA::8}" x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
