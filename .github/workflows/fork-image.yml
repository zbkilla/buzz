# Fork-only: check and build the sentinel fail-closed harness from a pinned
# commit, as a 3-day workflow artifact the droplet downloads. No registry
# push, no secrets.
# 2026-10-24: buzz-acp rejects permission requests in dont-ask and plan modes.
name: Fork image (zbk-droplet)

on:
  push:
    branches: ["upgrade/**-build"]

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact tree: sentinel/fail-closed-permissions on fork main b44f28a7.
  FIX_SHA: 1bfe53341a1cd6585247f45990c0ef7db74fb7c6

jobs:
  acp-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.FIX_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$FIX_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: rustfmt
        run: cargo fmt -p buzz-acp -- --check
      - name: clippy
        run: cargo clippy -p buzz-acp --all-targets --locked -- -D warnings
      - name: buzz-acp package tests (nextest, process per test, as upstream)
        if: ${{ !cancelled() }}
        run: cargo nextest run -p buzz-acp --locked

  sentinel-sprig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.FIX_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$FIX_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cross@0.2.5
      - name: Build sprig (musl, same script as upstream sprig.yml)
        run: |
          set -euo pipefail
          USE_CROSS=1 ARCHIVE_BASENAME=sprig-sentinel-x86_64-unknown-linux-musl \
            ./scripts/build-sprig.sh "0.1.0+failclosed.${FIX_SHA::8}" x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-sprig
          path: dist/sprig-sentinel-x86_64-unknown-linux-musl.tar.gz*
          retention-days: 3
          if-no-files-found: error
