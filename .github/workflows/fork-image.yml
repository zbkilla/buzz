# Fork-only: test and build the zbk-droplet relay image and the three sprig
# harnesses (fork, agy fix, sentinel fail-closed) from pinned commits, as
# 3-day workflow artifacts the droplet downloads. No registry push, no
# secrets. Never merged: lives only on upgrade/**-build branches.
# 2026-11-08: upgrade to upstream d839d3731. The test jobs are upstream's
# own (_ci-rust.yml, _ci-relay.yml, _ci-clients.yml at d839d3731),
# copied by .scratch/gen_fork_image.py with caches removed and checkout
# pinned; called directly they would also start Windows Rust and the
# Desktop Playwright shards.
name: Fork image (zbk-droplet)

on:
  push:
    branches: ["upgrade/**-build"]

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact trees. MERGE_SHA = the fork main candidate (upgrade/d839d373);
  # AGY_SHA and SENTINEL_SHA = those fixes rebased onto it.
  MERGE_SHA: 5a4f24a65c2309065409ed43f08c7d51b839e484
  AGY_SHA: df3b3442eb7532f401d0de9dae6598821ad7f3c0
  SENTINEL_SHA: e28e679e4c2f7175847db2ce9fb75ff63b4eec86
  # From upstream's reusable workflows' env.
  CARGO_TERM_COLOR: always
  BUZZ_TEST_POSTGRES_PASSWORD: buzz_dev
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Format check
        run: just fmt-check
      - name: Desktop Tauri format check
        run: just desktop-tauri-fmt-check
      - name: Clippy
        run: just clippy

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: Unit tests
        run: just test-unit

  relay-artifacts:
    name: Desktop E2E Relay (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: relay-binaries
            paths: |
              target/ci/buzz-relay
              target/ci/git-credential-nostr
          - artifact: backend-integration-tests
            paths: target/ci/backend-integration-tests.tar.zst
          - artifact: postgres-tests
            paths: target/ci/postgres-tests.tar.zst
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      - name: Install cargo-nextest
        if: matrix.artifact != 'relay-binaries'
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: Build relay binaries
        if: matrix.artifact == 'relay-binaries'
        run: cargo build --profile ci -p buzz-relay -p git-credential-nostr
      - name: Build backend integration test archive
        if: matrix.artifact == 'backend-integration-tests'
        run: |
          cargo nextest archive \
            --cargo-profile ci \
            -p buzz-db \
            -p buzz-relay \
            -p buzz-relay-mesh \
            -p buzz-test-client \
            --lib \
            --test e2e_event_reminder \
            --test e2e_author_only_deletion \
            --test e2e_existence_oracle \
            --archive-file target/ci/backend-integration-tests.tar.zst
      - name: Build PostgreSQL test archive
        if: matrix.artifact == 'postgres-tests'
        run: |
          postgres_package_args=()
          while IFS= read -r package; do
            postgres_package_args+=(-p "$package")
          done < <(scripts/postgres-test-packages.sh)
          if [[ "${#postgres_package_args[@]}" -eq 0 ]]; then
            echo "no PostgreSQL test packages were discovered" >&2
            exit 1
          fi
          cargo nextest archive \
            --cargo-profile ci \
            "${postgres_package_args[@]}" \
            --lib \
            --tests \
            --archive-file target/ci/postgres-tests.tar.zst
      - name: Upload relay artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-relay-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 1

  postgres-tests:
    name: PostgreSQL Tests
    needs: [relay-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buzz
          POSTGRES_PASSWORD: ${{ env.BUZZ_TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buzz -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: buzz
      PG_BIN_DIR: /usr/bin
      REDIS_URL: redis://localhost:6379
      PGSCHEMA_PLAN_HOST: localhost
      PGSCHEMA_PLAN_PORT: "5432"
      PGSCHEMA_PLAN_USER: buzz
      PGSCHEMA_PLAN_PASSWORD: buzz_dev
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      # pgschema has no --version; --help exits 0 once Hermit has fetched it.
      - name: Fetch Hermit tools
        run: scripts/ci-hermit-retry.sh ./bin/pgschema --help
      - name: Tune disposable PostgreSQL
        env:
          PGPASSWORD: ${{ env.BUZZ_TEST_POSTGRES_PASSWORD }}
        run: |
          # Database-per-test cloning forces checkpoints. Durability is redundant
          # for this disposable service and makes runtime depend on runner disk I/O.
          psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET synchronous_commit = off;
          SELECT pg_reload_conf();
          SQL
          psql --dbname postgres --tuples-only --no-align --command \
            "SELECT bool_and(setting = 'off') FROM pg_settings WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')" \
            | grep --fixed-strings --line-regexp t
      - name: Install cargo-nextest
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: Download backend test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-e2e-relay-*
          merge-multiple: true
          path: target/ci
      - name: Restore relay executable permission
        run: chmod +x ./target/ci/buzz-relay
      - name: PostgreSQL-backed tests
        env:
          BUZZ_POSTGRES_ADMIN_URL: postgres://buzz:${{ env.BUZZ_TEST_POSTGRES_PASSWORD }}@localhost:5432/postgres
          PGPASSWORD: ${{ env.BUZZ_TEST_POSTGRES_PASSWORD }}
        run: |
          scripts/postgres-test-run.sh \
            --archive-file target/ci/postgres-tests.tar.zst

  backend-integration:
    name: Backend Integration (relay e2e)
    needs: [relay-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      # pgschema has no --version; --help exits 0 once Hermit has fetched it.
      - name: Fetch Hermit tools
        run: scripts/ci-hermit-retry.sh ./bin/pgschema --help
      - name: Install cargo-nextest
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: Start integration services
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d postgres redis minio minio-init; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "docker compose up failed after 3 attempts" >&2
              exit 1
            fi
            echo "docker compose up failed (attempt $attempt), retrying in $((attempt * 5))s..." >&2
            sleep $((attempt * 5))
          done
      - name: Wait for integration services
        run: |
          wait_healthy() {
            local service="$1"
            local container="$2"
            for attempt in $(seq 1 60); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "${container}" 2>/dev/null || echo "not_found")
              if [ "${status}" = "healthy" ]; then
                echo "${service} is healthy"
                return 0
              fi
              sleep 2
            done
            docker logs "${container}" || true
            return 1
          }
          wait_healthy "Postgres" "buzz-postgres"
          wait_healthy "Redis" "buzz-redis"
          wait_healthy "MinIO" "buzz-minio"
      - name: Download relay artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-e2e-relay-*
          merge-multiple: true
          path: target/ci
      - name: Apply schema and seed deployment community
        # MT: the relay resolves each request's tenant from the communities host
        # map and fails closed on an unmapped host. The reminder scheduler binds
        # the deployment community ONCE at boot and exits permanently on an
        # unmapped host (no retry, unlike the channel reconciler), so the
        # 'localhost:3000' community MUST exist before the relay starts — seeding
        # after boot leaves the scheduler dead. The relay migrates at boot via
        # BUZZ_AUTO_MIGRATE, but that's too late for the pre-boot seed, so apply
        # the schema here first (then drop AUTO_MIGRATE below). lower(host) is the
        # unique index → ON CONFLICT target. psql isn't on PATH in hermit → exec
        # into the buzz-postgres container.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: buzz
          PGPASSWORD: buzz_dev
          PGDATABASE: buzz
          # Use the already-running docker postgres for desired-state planning instead of
          # downloading an embedded Postgres from Maven Central (transient-fetch flake source).
          PGSCHEMA_PLAN_HOST: localhost
          PGSCHEMA_PLAN_PORT: "5432"
          PGSCHEMA_PLAN_DB: buzz
          PGSCHEMA_PLAN_USER: buzz
          PGSCHEMA_PLAN_PASSWORD: buzz_dev
        run: |
          ./bin/pgschema apply --file schema/schema.sql --auto-approve
          docker exec -i -e PGPASSWORD=buzz_dev buzz-postgres \
            psql -U buzz -d buzz -v ON_ERROR_STOP=1 < scripts/reconcile-schema-after-pgschema.sql
          docker exec -e PGPASSWORD=buzz_dev buzz-postgres \
            psql -U buzz -d buzz -qtA -c "
          INSERT INTO communities (id, host)
          VALUES ('00000000-0000-4000-8000-00000000c0de', 'localhost:3000')
          ON CONFLICT (lower(host)) DO NOTHING
          ;"
      - name: Git default-branch route and clone regressions
        env:
          # The preceding step already applied and reconciled schema/schema.sql.
          BUZZ_TEST_SCHEMA_MODE: desired
          BUZZ_TEST_DATABASE_URL: postgres://buzz:${{ env.BUZZ_TEST_POSTGRES_PASSWORD }}@localhost:5432/buzz
          BUZZ_TEST_REDIS_URL: redis://localhost:6379
          BUZZ_TEST_S3_ENDPOINT: http://localhost:9000
          BUZZ_TEST_S3_BUCKET: buzz-media
        run: |
          cargo nextest run \
            --archive-file target/ci/backend-integration-tests.tar.zst \
            -E 'package(buzz-relay) and test(/api::git::settings::tests::external_infra::/)' \
            --run-ignored ignored-only
      - name: Admin attachment access-log regression
        env:
          # This test builds its state from Config::for_test(), which reads the
          # relay's own DATABASE_URL and BUZZ_S3_* variables.
          DATABASE_URL: postgres://buzz:${{ env.BUZZ_TEST_POSTGRES_PASSWORD }}@localhost:5432/buzz
          BUZZ_S3_ENDPOINT: http://localhost:9000
          BUZZ_S3_BUCKET: buzz-media
        run: |
          cargo nextest run \
            --archive-file target/ci/backend-integration-tests.tar.zst \
            -E 'package(buzz-relay) and test(/api::admin::postgres_tests::external_infra_minio_tests::/)' \
            --run-ignored ignored-only
      - name: Relay quota accounting and rejection regressions
        env:
          BUZZ_TEST_REDIS_URL: redis://localhost:6379
        run: |
          cargo nextest run \
            --archive-file target/ci/backend-integration-tests.tar.zst \
            -E 'package(buzz-relay) and (test(/^rejection::/) or test(/^admission::/))' \
            --run-ignored all
      - name: NIP-FI cross-pod command replay regressions
        env:
          BUZZ_TEST_REDIS_URL: redis://localhost:6379
        run: |
          cargo nextest run \
            --archive-file target/ci/backend-integration-tests.tar.zst \
            -E 'package(buzz-relay) and test(/^api::nip_fi::route_integration_tests::external_infra_redis::/)' \
            --run-ignored ignored-only
      - name: Mesh ready-registry index regressions
        env:
          BUZZ_TEST_REDIS_URL: redis://localhost:6379
        run: |
          cargo nextest run \
            --archive-file target/ci/backend-integration-tests.tar.zst \
            -E 'package(buzz-relay-mesh) and test(/^registry::tests::external_infra_redis::/)' \
            --run-ignored ignored-only
      - name: Workflow message provenance unit tests
        # The relay's workflow_sink suite is not selected by the infra-free
        # unit job. Its ignored database cases run in the isolated PostgreSQL
        # lane; keep the pure provenance cases covered here without duplication.
        run: |
          cargo nextest run \
            --archive-file target/ci/backend-integration-tests.tar.zst \
            -E 'package(buzz-relay) and test(/workflow_sink/)'
      - name: Start relay
        run: |
          chmod +x ./target/ci/buzz-relay
          nohup env \
            DATABASE_URL="postgres://buzz:${BUZZ_TEST_POSTGRES_PASSWORD}@localhost:5432/buzz" \
            REDIS_URL=redis://localhost:6379 \
            RELAY_URL=ws://localhost:3000 \
            BUZZ_BIND_ADDR=0.0.0.0:3000 \
            BUZZ_RELAY_PRIVATE_KEY="$(openssl rand -hex 32)" \
            BUZZ_REQUIRE_AUTH_TOKEN=false \
            BUZZ_RECONCILE_CHANNELS=true \
            BUZZ_GIT_PROBE_WRITERS=8 \
            SPROUT_REMINDER_SCHEDULER_INTERVAL_SECS=1 \
            ./target/ci/buzz-relay > /tmp/buzz-relay.log 2>&1 &
          echo $! > /tmp/buzz-relay.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/buzz-relay.pid)" 2>/dev/null; then
              cat /tmp/buzz-relay.log
              exit 1
            fi
            status_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/_readiness || true)
            if [ "${status_code}" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buzz-relay.log
          exit 1
      - name: NIP-ER reminder e2e
        # Feature e2e for NIP-ER (Event Reminders, kind:30300): write-path
        # validation, author-only read filtering, and scheduler delivery against
        # a live relay. The schema-drift / migration-version guarantee is owned
        # by the buzz-db migration.rs unit tests, not this suite.
        run: |
          cargo nextest run \
            --archive-file target/ci/backend-integration-tests.tar.zst \
            -E 'binary(e2e_event_reminder) | binary(e2e_author_only_deletion) | binary(e2e_existence_oracle)' \
            --run-ignored ignored-only
        env:
          RELAY_URL: ws://localhost:3000
          # schema/schema.sql (applied above) indexes kind:5 content.
          BUZZ_TEST_SEARCH_INDEXES_DELETIONS: "1"
      - name: Upload relay log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-integration-relay-log
          path: /tmp/buzz-relay.log
          if-no-files-found: ignore

  relay-e2e:
    name: Relay E2E
    needs: [relay-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      # Reuse the relay + git-credential-nostr built by Desktop E2E Relay
      # instead of compiling them a second time.
      - name: Download relay binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-e2e-relay-*
          merge-multiple: true
          path: target/ci
      - name: Start relay
        env:
          BUZZ_MEDIA_READ_MODE: enforce
        run: |
          chmod +x ./target/ci/buzz-relay ./target/ci/git-credential-nostr
          ./scripts/start-relay-for-tests.sh --no-build
      - name: Relay E2E tests
        run: |
          cargo test -p buzz-test-client --test e2e_persona --test e2e_team_catalog --test e2e_nostr_interop --test e2e_thread_roots --test e2e_project -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay invite -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip43_membership_snapshots_are_rejected -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_departure_wire -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_batch_put_user_wire -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_announce_channel_wire -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_unlisted_channel_wire -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_solo_share_and_convert_wire -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_member_raises_guest_agent -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_guest_is_read_only_in_normal_channel -- --ignored --nocapture
          cargo test -p buzz-test-client --test e2e_relay nip29_relay_rejects_role_change_by_unprivileged_actor -- --ignored --nocapture
        env:
          RELAY_URL: ws://localhost:3000
          GIT_CREDENTIAL_NOSTR_BIN: ${{ github.workspace }}/target/ci/git-credential-nostr
      - name: Media read-auth e2e
        # Reads require kind:24242 `t=get` auth, so these binaries are the only
        # coverage that a real relay rejects bare reads and honours host- and
        # hash-scoped tokens. They were #[ignore]d and selected by no CI job, so
        # the lane never ran; select it here, where MinIO and the seeded
        # 'localhost:3000' community already exist.
        # --no-fail-fast: without it cargo stops after the first failing binary,
        # so one broken case hides every later binary's result.
        run: |
          cargo test -p buzz-test-client --no-fail-fast --test e2e_media --test e2e_media_extended --test e2e_media_video -- --ignored --nocapture
        env:
          RELAY_URL: ws://localhost:3000
          RELAY_HTTP_URL: http://localhost:3000
      - name: Upload relay logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-e2e-artifacts
          path: /tmp/buzz-relay.log
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web lint and format
        run: just web-check
      - name: Web build
        run: just web-build

  pairing-tests:
    name: Pairing crates (fork patches)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cargo-nextest@0.9.136
      - name: buzz-pair-relay and buzz-pairing-cli tests (not in upstream's unit lane)
        run: cargo nextest run --locked -p buzz-pair-relay -p buzz-pairing-cli

  relay-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$MERGE_SHA"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # Same cap as upstream docker.yml: default parallelism OOMs the runner.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build runtime image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target runtime \
            --build-arg BUZZ_SOURCE_SHA="$MERGE_SHA" \
            --build-arg BUZZ_BUILD_ID="github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --build-arg BUZZ_BUILD_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --provenance=false --sbom=false \
            --label org.opencontainers.image.revision="$MERGE_SHA" \
            --tag "buzz-fork:${MERGE_SHA::8}" \
            --output "type=docker,dest=relay-image.tar" .
          gzip -6 relay-image.tar
          sha256sum relay-image.tar.gz | tee relay-image.tar.gz.sha256
          printf 'merge_sha=%s\nrun=%s\n' "$MERGE_SHA" "$GITHUB_RUN_ID" > relay-image.provenance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-image
          path: |
            relay-image.tar.gz
            relay-image.tar.gz.sha256
            relay-image.provenance
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  main-sprig:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
