  all-jobs:
    name: All jobs passed
    if: ${{ always() }}
    needs: [rust-lint, unit-tests, relay-artifacts, postgres-tests, backend-integration, relay-e2e, web, pairing-tests, relay-image, main-sprig, agy-sprig, agy-acp-tests, sentinel-acp-checks, sentinel-sprig]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded (none skipped, failed or cancelled)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length == 14 and (to_entries | all(.value.result == "success"))'
